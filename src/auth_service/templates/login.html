<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Incident Response Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }

        .page-actions {
            position: fixed;
            top: 18px;
            right: 18px;
            display: flex;
            gap: 10px;
            z-index: 1100;
        }

        .action-link {
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 9px 12px;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.09);
            color: #eef4ff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .action-link:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.45);
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 8px;
        }

        .logo p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #4dabf7;
            background: rgba(255, 255, 255, 0.1);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #4dabf7 0%, #228be6 100%);
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(77, 171, 247, 0.3);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .auth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0 16px;
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .auth-divider::before,
        .auth-divider::after {
            content: "";
            flex: 1;
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .auth-divider span {
            padding: 0 10px;
        }

        .social-auth {
            display: grid;
            gap: 10px;
        }

        .btn-social {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 12px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s ease;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
        }

        .btn-social:hover {
            transform: translateY(-1px);
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.14);
        }

        .btn-social.google {
            color: #f8fafc;
        }

        .btn-social.github {
            color: #e2e8f0;
        }

        .error-message {
            background: rgba(255, 82, 82, 0.2);
            border: 1px solid rgba(255, 82, 82, 0.5);
            color: #ff6b6b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }

        .register-link a {
            color: #4dabf7;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        .btn-login.loading .loading-spinner {
            display: inline-block;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .version {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12px;
        }

        .logout-overlay {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(3, 8, 20, 0.65);
            z-index: 1200;
        }

        .logout-overlay.active {
            display: flex;
        }

        .logout-box {
            background: #111a2e;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 18px 24px;
            min-width: 260px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logout-spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #7fc3ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .logout-text {
            color: #f0f6ff;
            font-size: 15px;
        }

        @media (max-width: 768px) {
            .page-actions {
                top: 10px;
                right: 10px;
                gap: 8px;
            }

            .action-link {
                padding: 8px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="page-actions">
        <a href="/logout" class="action-link logout-link">Logout</a>
    </div>

    <div class="login-container">
        <div class="logo">
            <h1>Incident Response</h1>
            <p>Central Authentication System</p>
        </div>

        <div id="error-message" class="error-message"></div>

        <form id="login-form" action="/login/form" method="POST">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username or email"
                    required
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    autocomplete="current-password"
                >
            </div>

            <button type="submit" class="btn-login" id="login-btn">
                <span class="loading-spinner"></span>
                <span class="btn-text">Sign In</span>
            </button>
        </form>

        <div class="auth-divider"><span>or continue with</span></div>

        <div class="social-auth">
            <a href="/oauth/google/login" class="btn-social google">Sign in with Google</a>
            <a href="/oauth/github/login" class="btn-social github">Sign in with GitHub</a>
        </div>

        <div class="register-link">
            Don't have an account? <a href="/register">Register</a>
        </div>

        <div class="version">v1.0.0</div>
    </div>

    <div id="logout-overlay" class="logout-overlay" aria-live="polite" aria-label="Logging out">
        <div class="logout-box">
            <div class="logout-spinner"></div>
            <div class="logout-text">Logging out...</div>
        </div>
    </div>

    <script>
        const logoutOverlay = document.getElementById('logout-overlay');
        document.querySelectorAll('.logout-link').forEach((link) => {
            link.addEventListener('click', (event) => {
                event.preventDefault();
                logoutOverlay.classList.add('active');
                setTimeout(() => {
                    window.location.href = link.href;
                }, 500);
            });
        });

        // Check for error in URL params
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        if (error) {
            showError(decodeURIComponent(error.replace(/\+/g, ' ')));
        }

        // Form submission with AJAX
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btn = document.getElementById('login-btn');
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Show loading state
            btn.classList.add('loading');
            btn.disabled = true;
            hideError();

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username, password }),
                    credentials: 'include'
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // Redirect to appropriate UI based on role
                    window.location.href = data.redirect_url;
                } else {
                    showError(data.detail || 'Login failed. Please try again.');
                }
            } catch (error) {
                console.error('Login error:', error);
                showError('Connection error. Please try again.');
            } finally {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        });

        function showError(message) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = message;
            errorEl.classList.add('show');
        }

        function hideError() {
            const errorEl = document.getElementById('error-message');
            errorEl.classList.remove('show');
        }

        // Focus on username field
        document.getElementById('username').focus();
    </script>
</body>
</html>
